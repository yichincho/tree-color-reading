<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三色閱讀 本機版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dots"><i class="d-black"></i><i class="d-blue"></i><i class="d-red"></i></span>
      <div>
        <h1>三色閱讀</h1>
        <p>先抓骨幹，再一段一段拆長難句</p>
      </div>
    </div>
    <button id="settingsToggle" class="status-pill" type="button">
      <span id="statusDot" class="dot warn"></span>
      <span id="statusLabel">尚未設定 API Key</span>
    </button>
  </header>

  <main class="layout">
    <section id="settingsPanel" class="card settings" aria-labelledby="settingsTitle">
      <div class="card-head">
        <h2 id="settingsTitle">API 設定</h2>
        <button id="settingsClose" class="ghost small" type="button">收合</button>
      </div>
      <div class="provider-row" role="radiogroup" aria-label="AI Provider">
        <label class="provider"><input type="radio" name="provider" value="gemini" checked><span><strong>Gemini</strong><small>gemini-flash-latest</small></span></label>
        <label class="provider"><input type="radio" name="provider" value="deepseek"><span><strong>DeepSeek V4.1-Flash</strong><small>deepseek-flash</small></span></label>
      </div>
      <label class="field">
        <span>API Key</span>
        <span class="key-row">
          <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="貼上你的 API Key">
          <button id="toggleKeyButton" class="ghost small" type="button">顯示</button>
        </span>
      </label>
      <div class="field">
        <label for="modelSelect">模型</label>
        <span class="key-row">
          <select id="modelSelect"></select>
          <button id="loadModelsButton" class="ghost small" type="button">讀取模型清單</button>
        </span>
        <input id="modelInput" type="text" spellcheck="false" aria-label="模型 ID" placeholder="或直接輸入模型 ID">
      </div>
      <label class="check"><input id="rememberKey" type="checkbox"> 在這台電腦的瀏覽器記住 Key（不勾選則關掉網頁就清除）</label>
      <div class="actions">
        <button id="saveSettingsButton" class="primary" type="button">套用</button>
        <button id="testConnectionButton" type="button">測試連線</button>
      </div>
      <p id="settingsMessage" class="message" role="status"></p>
    </section>

    <section class="card input" aria-labelledby="inputTitle">
      <div class="card-head">
        <h2 id="inputTitle">貼上英文文章</h2>
        <span class="hint">段落之間空一行，會一段一段分析</span>
      </div>
      <textarea id="articleInput" rows="10" placeholder="Paste an English article here…&#10;&#10;Separate paragraphs with a blank line."></textarea>
      <div class="actions wrap">
        <label class="file-button">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <span>選擇圖片</span>
        </label>
        <button id="ocrButton" type="button" disabled>從圖片擷取文字</button>
        <span id="imageName" class="muted">未選圖片</span>
        <span class="spacer"></span>
        <label class="quick-model"><span>模型</span><select id="quickModelSelect" aria-label="分析用的模型"></select></label>
        <button id="clearButton" class="ghost" type="button">清除</button>
        <button id="cancelButton" type="button" disabled>取消</button>
        <button id="startButton" class="primary" type="button">開始分析</button>
      </div>
      <div id="progress" class="progress" hidden>
        <div class="bar"><i id="progressBar"></i></div>
        <p id="progressText" role="status"></p>
      </div>
      <p id="inputMessage" class="message" role="alert"></p>
    </section>

    <section id="stepOne" class="card" hidden aria-labelledby="stepOneTitle">
      <div class="card-head">
        <h2 id="stepOneTitle">Step One · 文章骨幹</h2>
      </div>
      <h3 id="articleTitle" class="article-title"></h3>
      <p id="articleThesis" class="thesis"></p>
      <ol id="outline" class="outline"></ol>
    </section>

    <section id="stepTwo" hidden aria-labelledby="stepTwoTitle">
      <div class="step-two-head">
        <h2 id="stepTwoTitle">Step Two · 三色脫水</h2>
        <div class="mode-tabs" role="tablist" aria-label="閱讀模式">
          <button class="mode black active" data-mode="dehydrate" type="button" role="tab" aria-selected="true">⚫ 脫水</button>
          <button class="mode blue" data-mode="skeleton" type="button" role="tab" aria-selected="false">🔵 骨幹</button>
          <button class="mode red" data-mode="reattach" type="button" role="tab" aria-selected="false">🔴 回填</button>
        </div>
      </div>
      <p id="modeHint" class="mode-hint"></p>
      <div id="paragraphs"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
